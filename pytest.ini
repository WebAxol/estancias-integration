[pytest]
# In the tests container (docker-compose.ci.yml) `src` sits in /app and the api test
# helpers in /app/api/tests. Outside Docker, `api` is the estancias-api submodule.
# Helpers are imported as `api.tests.*`.
pythonpath = . api
testpaths = tests
addopts = -p no:launch_testing -p no:launch_testing_ros
