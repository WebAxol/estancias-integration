name: estancias

services:
  db:
    image: postgres:17
    container_name: estancias-db
    restart: unless-stopped
    # env_file is read straight from .env, so variables exported in the host shell cannot override it
    env_file: .env
    ports:
      # Bound to localhost only so the DB isn't exposed on the network
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Run once on first init of an empty data volume, in ascending filename order
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: estancias-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the compose network the API reaches Postgres by service name and container port.
      # These take precedence over .env.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      # Published on all host interfaces (0.0.0.0) so other devices can reach the API
      - "0.0.0.0:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
