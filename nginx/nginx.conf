events {}

http {
    # Evita alerta en OWASP ZAP
    server_tokens off;

    # IP del cliente solo cuando el trafico viene de red interna de docker
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    
    # Limite para la API de 10 peticiones/segundo por IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # Limite para endpoints de login de 5 peticiones/minuto por IP
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    limit_req_status 429;


    # Redireccion de HTTP (80) a HTTPS (8000)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # Servidor HTTPS principal
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        error_page 497 =301 https://$http_host%request_uri;

        ssl_certificate     /etc/nginx/certs/ec_cert.pem;
        ssl_certificate_key /etc/nginx/certs/ec_key.pem;

        # protocolos (bloquea SSLv3, TLS 1.0 y TLS 1.1)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Cabeceras de seguridad estándar ("always" garantiza envío también en 4xx/5xx)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        
        proxy_hide_header Server;
        location = /metrics { # Bloquea el acceso externo a metricas de Prometheus (solo acceso interno desde Docker)
          return 403;
        }
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}