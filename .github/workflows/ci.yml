name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: docker-compose.ci.yml
    steps:
      # The default GITHUB_TOKEN only reads this repository, so the private submodules
      # are fetched over SSH with one read-only deploy key per repository.
      - name: Require the deploy keys
        env:
          API_KEY: ${{ secrets.API_KEY }}
          DB_KEY: ${{ secrets.DB_KEY }}
        run: |
          for name in API_KEY DB_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set. Add the private deploy key under Settings > Secrets and variables > Actions > Repository secrets."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      # Each key comment must be the SSH URL of its repository, for example
      # git@github.com:WebAxol/estancias-api.git. The action uses it to pick the key
      # per repository and rewrites the https URLs of .gitmodules to SSH.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.API_KEY }}
            ${{ secrets.DB_KEY }}

      - name: Fetch submodules
        run: git submodule update --init --recursive --depth=1

      - name: Check submodules and migrations
        run: |
          test -f api/Dockerfile
          test -f api/tests/fakes.py
          count=$(ls db/migrations/*.sql | wc -l)
          echo "Found $count migrations"
          test "$count" -gt 0

      - name: Validate compose file
        run: docker compose config --quiet

      # Builds the api image, starts a clean PostgreSQL 17 and runs the suite in the
      # api container. The run fails on any test failure or skipped test.
      - name: Run integration tests
        run: docker compose run --rm --build tests

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
