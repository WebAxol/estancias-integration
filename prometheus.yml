# Prometheus configuration for monitoring the Estancias API
global:
  scrape_interval: 15s      # Default scrape interval for all jobs
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  scrape_timeout: 10s       # Timeout for each scrape

  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager)
  external_labels:
    monitor: 'estancias-monitor'
    environment: 'dev'

# Scrape configurations
scrape_configs:
  # Job for scraping API metrics
  - job_name: 'estancias-api'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'
          component: 'backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Job for Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          component: 'monitoring'

  # Job for scraping PostgreSQL metrics
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          component: 'database'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
